{% extends 'studio/auth_base.html' %}

{% block title %}Déconnexion{% endblock %}

{% block content %}
    <div class="eyebrow">Session active</div>
    <h1>Se déconnecter</h1>
    <p class="auth-intro">Les traitements déjà envoyés au worker continueront en arrière-plan.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-primary full-width" type="submit">Confirmer la déconnexion</button>
    </form>
    <p class="auth-footer"><a href="{% url 'accounts:home' %}">Retour au studio</a></p>
{% endblock %}
