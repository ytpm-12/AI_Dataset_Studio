<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Inscription - AI Dataset Studio</title>
</head>
<body>
    <main>
        <h1>Créer un compte</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Créer le compte</button>
        </form>

        <p>
            Déjà inscrit ?
            <a href="{% url 'accounts:login' %}">Se connecter</a>
        </p>
    </main>
</body>
</html>
