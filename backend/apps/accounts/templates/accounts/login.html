<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Connexion - AI Dataset Studio</title>
</head>
<body>
    <main>
        <h1>Connexion</h1>

        <form method="post">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            {{ form.as_p }}
            <button type="submit">Se connecter</button>
        </form>

        <p>
            Pas encore de compte ?
            <a href="{% url 'accounts:register' %}">Créer un compte</a>
        </p>
    </main>
</body>
</html>
